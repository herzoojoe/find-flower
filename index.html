<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>식물 인식기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f7f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 { font-size: 2rem; color: #2d6a4f; margin-bottom: 8px; }
    .subtitle { color: #52796f; margin-bottom: 36px; font-size: 0.95rem; }

    .upload-area {
      width: 100%;
      max-width: 480px;
      background: white;
      border: 2px dashed #95d5b2;
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area.drag-over { border-color: #2d6a4f; background: #d8f3dc; }
    .upload-icon { font-size: 3rem; margin-bottom: 12px; }
    .upload-text { color: #52796f; font-size: 0.95rem; line-height: 1.6; }
    #file-input { display: none; }

    #preview-wrap { margin-top: 16px; display: none; }
    #preview {
      width: 100%;
      max-width: 480px;
      max-height: 320px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid #b7e4c7;
    }

    #analyze-btn {
      margin-top: 20px;
      padding: 14px 48px;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: none;
    }
    #analyze-btn:hover { background: #1b4332; }
    #analyze-btn:active { transform: scale(0.97); }
    #analyze-btn:disabled { background: #95d5b2; cursor: not-allowed; }

    #loading {
      display: none;
      margin-top: 24px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #52796f;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #d8f3dc;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #result-card {
      display: none;
      margin-top: 32px;
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(45,106,79,0.12);
      overflow: hidden;
    }
    .card-header { background: #2d6a4f; color: white; padding: 20px 24px; }
    .plant-name-ko  { font-size: 1.5rem; font-weight: 700; }
    .plant-name-sci { font-size: 0.85rem; opacity: 0.8; font-style: italic; margin-top: 4px; }
    .card-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
    .info-row { display: flex; align-items: center; gap: 12px; }
    .info-icon  { font-size: 1.3rem; width: 28px; text-align: center; }
    .info-label {
      font-size: 0.78rem; color: #95a5a6; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      width: 80px; flex-shrink: 0;
    }
    .info-value { color: #2c3e50; font-size: 0.95rem; }
    .badge { padding: 3px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; }
    .badge-easy   { background: #d8f3dc; color: #1b4332; }
    .badge-medium { background: #fff3cd; color: #856404; }
    .badge-hard   { background: #fde8e8; color: #9b2335; }
    .divider { border: none; border-top: 1px solid #f0f0f0; }
    .tips-section { padding: 0 24px 20px; }
    .tips-label {
      font-size: 0.78rem; color: #95a5a6; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
    }
    .tips-text { color: #52796f; font-size: 0.9rem; line-height: 1.6; }

    #error-msg {
      display: none;
      margin-top: 20px;
      padding: 14px 20px;
      background: #fde8e8;
      border-radius: 10px;
      color: #9b2335;
      font-size: 0.9rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🌿 식물 인식기</h1>
  <p class="subtitle">식물 사진을 업로드하면 이름과 관리법을 알려드립니다.</p>

  <div class="upload-area" id="upload-area">
    <div class="upload-icon">📷</div>
    <p class="upload-text">
      이미지를 여기에 드래그하거나<br>
      <strong>클릭해서 파일을 선택</strong>하세요
    </p>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <div id="preview-wrap">
    <img id="preview" src="" alt="미리보기">
  </div>

  <button id="analyze-btn">식물 분석하기</button>

  <div id="loading">
    <div class="spinner"></div>
    <span>식물을 분석하는 중...</span>
  </div>

  <div id="error-msg"></div>

  <div id="result-card">
    <div class="card-header">
      <div class="plant-name-ko"  id="res-name-ko"></div>
      <div class="plant-name-sci" id="res-name-sci"></div>
    </div>
    <div class="card-body">
      <div class="info-row">
        <span class="info-icon">💧</span>
        <span class="info-label">물 주기</span>
        <span class="info-value" id="res-watering"></span>
      </div>
      <div class="info-row">
        <span class="info-icon">☀️</span>
        <span class="info-label">햇빛</span>
        <span class="info-value" id="res-sunlight"></span>
      </div>
      <div class="info-row">
        <span class="info-icon">🌱</span>
        <span class="info-label">난이도</span>
        <span id="res-difficulty"></span>
      </div>
    </div>
    <hr class="divider">
    <div class="tips-section">
      <div class="tips-label">관리 팁</div>
      <div class="tips-text" id="res-tips"></div>
    </div>
  </div>

  <script>
    // ── Render 배포 후 실제 URL로 교체 ──────────────────────────
    const BACKEND_URL = 'https://find-flower-api.onrender.com';
    // ──────────────────────────────────────────────────────────────

    const uploadArea  = document.getElementById('upload-area');
    const fileInput   = document.getElementById('file-input');
    const previewWrap = document.getElementById('preview-wrap');
    const preview     = document.getElementById('preview');
    const analyzeBtn  = document.getElementById('analyze-btn');
    const loading     = document.getElementById('loading');
    const errorMsg    = document.getElementById('error-msg');
    const resultCard  = document.getElementById('result-card');

    let selectedFile = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => {
      e.preventDefault();
      uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleFile(file);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewWrap.style.display = 'block';
        analyzeBtn.style.display  = 'inline-block';
        resultCard.style.display  = 'none';
        errorMsg.style.display    = 'none';
      };
      reader.readAsDataURL(file);
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      analyzeBtn.disabled = true;
      loading.style.display    = 'flex';
      resultCard.style.display = 'none';
      errorMsg.style.display   = 'none';

      const form = new FormData();
      form.append('image', selectedFile);

      try {
        const res  = await fetch(`${BACKEND_URL}/analyze`, { method: 'POST', body: form });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        showResult(data);
      } catch (e) {
        showError(e.message || '서버 오류가 발생했습니다. 다시 시도해주세요.');
      } finally {
        loading.style.display = 'none';
        analyzeBtn.disabled   = false;
      }
    });

    function showResult(data) {
      document.getElementById('res-name-ko').textContent  = data.name_korean    || '-';
      document.getElementById('res-name-sci').textContent = data.name_scientific || '';
      document.getElementById('res-watering').textContent = data.watering        || '-';
      document.getElementById('res-sunlight').textContent = data.sunlight        || '-';
      document.getElementById('res-tips').textContent     = data.tips            || '-';

      const diff = data.difficulty || '';
      const cls  = diff === '쉬움' ? 'badge-easy' : diff === '어려움' ? 'badge-hard' : 'badge-medium';
      document.getElementById('res-difficulty').innerHTML =
        `<span class="badge ${cls}">${diff}</span>`;

      resultCard.style.display = 'block';
    }

    function showError(msg) {
      errorMsg.textContent   = '⚠️ ' + msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
